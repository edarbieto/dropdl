# Offline tests on every supported platform, for pushes to master and pull requests.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  # Same toolchain as release.yml, so sizes and warnings match.
  RUST_VERSION: "1.99.1"
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
