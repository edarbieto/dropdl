[package]
name = "dropdl"
version = "0.3.1"
edition = "2024"
description = "Minimal GUI to download video/audio from a pasted link, powered by yt-dlp"
repository = "https://github.com/edarbieto/dropdl"
license = "MIT OR Apache-2.0"

[dependencies]
dirs = "7.0.0"
# glow (OpenGL) instead of the default wgpu renderer: ~6 MB smaller, runs on Windows/macOS/Linux.
eframe = { version = "0.36.2", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "links",
    "persistence",
    "wayland",
    "x11",
] }
# Decodes search result covers; eframe already links image, this only adds JPEG.
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
lofty = "0.25.4"
rfd = "0.17.2"
# Already linked through rustls; used for the update checksum.
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3.4.2"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }

# Exe icon and version metadata (build.rs); build-time only.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

# Size-focused; measurements in docs/release.md.
[profile.release]
opt-level = "s"
panic = "abort"
lto = true
strip = true
codegen-units = 1
