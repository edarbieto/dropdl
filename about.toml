# cargo-about config: `cargo about generate about.hbs -o THIRD-PARTY-LICENSES.txt` (docs/release.md, License notices).
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "ISC",
    "Zlib",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Bitstream-Vera",
]
# Release targets only; Linux comes later.
targets = ["x86_64-pc-windows-msvc", "aarch64-apple-darwin"]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# egui's embedded fonts: their notices are files cargo-about doesn't pick up on its own
# (Hack is MIT plus the Bitstream Vera license). Re-check when the checksums stop matching.
[epaint_default_fonts.clarify]
license = "(MIT OR Apache-2.0) AND OFL-1.1 AND Ubuntu-font-1.0 AND MIT AND Bitstream-Vera"
[[epaint_default_fonts.clarify.files]]
path = "fonts/OFL.txt"
license = "OFL-1.1"
checksum = "6a73f9541c2de74158c0e7cf6b0a58ef774f5a780bf191f2d7ec9cc53efe2bf2"
[[epaint_default_fonts.clarify.files]]
path = "fonts/UFL.txt"
license = "Ubuntu-font-1.0"
checksum = "2f0015108d68627bd788d313f529c21ff4da2c2c42a5e1f3883acc83480f9002"
[[epaint_default_fonts.clarify.files]]
path = "fonts/emoji-icon-font-mit-license.txt"
license = "MIT"
checksum = "b9d2c1d909aa149996fd4c91dcb92b2362a04431640c1d200959da94caf8cde1"
[[epaint_default_fonts.clarify.files]]
path = "fonts/Hack-Regular.txt"
license = "Bitstream-Vera"
checksum = "47c0cccbeec7e8614548cc485588b28149e7874188df5f41b36efebcee285c87"
